#
# A release is a version tag, built and attested by one job and signed and uploaded to Maven Central
# by another. Central requires a PGP signature on every file and offers no credential that is issued
# at the moment of use, so a signing subkey and a Central token have to be stored. This workflow is
# shaped around how little code may run beside them.
#
# ── WHY TWO JOBS ─────────────────────────────────────────────────────────────────────────────────
#
# `build` runs Maven, which resolves and executes plugins at run time. It holds no secret. It stages
# every file Central requires into a local repository layout and attests exactly those bytes.
#
# `publish` runs in the `maven-central` environment, which is the only place the secrets exist. The
# environment admits only `v*.*.*` tags and waits for a reviewer. The job runs no Maven, no JDK and
# no action beyond downloading the staged files. Every command it executes is written below. It
# treats the staged files as data: it signs them, zips them and uploads them. Nothing from `build`
# is executed here. So a compromised build plugin can corrupt what is published, but it cannot read
# the key.
#
# ── WHAT THIS DOES NOT COVER ─────────────────────────────────────────────────────────────────────
#
# - A compromised `build` job produces a malicious jar that is then attested and signed like any
#   other. The attestation says where a jar was built, not that its contents are benign.
# - The reviewer is the only maintainer, so the approval stops automation and mistakes, not a stolen
#   credential of that maintainer.
#
# A push of an exact version tag publishes. A manual run on any `v*.*.*` tag validates only: it
# uploads as USER_MANAGED, waits for Central to validate the bundle, then drops the deployment.
# That is how this path is proven against Central without spending a version.
#
# Actions are referenced by commit SHA. A tag can be moved by whoever controls the action's
# repository, and a moved tag would run their code in these jobs.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -q -B test
      - run: |
          mvn -q -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" -P release deploy \
            -DaltDeploymentRepository="staging::file:${GITHUB_WORKSPACE}/target/staging"
      # maven-metadata files describe a local repository, not a component. Central does not ask for
      # them, and an upload bundle has no use for them.
      - run: find target/staging -name 'maven-metadata*' -delete
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            target/staging/**/*.jar
            target/staging/**/*.pom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging
          path: target/staging/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    permissions: {}
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging
          path: staging
      - name: sign, bundle, upload and wait for Central
        env:
          SIGNING_SUBKEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          PUBLISHING_TYPE: ${{ github.event_name == 'push' && 'AUTOMATIC' || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          umask 077
          api=https://central.sonatype.com/api/v1/publisher
          cd staging

          # The token can publish anything in the namespace. The bundle may contain only this
          # project's coordinates, whatever the build job staged.
          outside=$(find . -type f ! -path './ai/ensera/taisce/*')
          if [ -n "$outside" ]; then printf '::error::staged outside ai.ensera.taisce:\n%s\n' "$outside"; exit 1; fi

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s\n' "$SIGNING_SUBKEY" | gpg --batch --quiet --import
          # Central wants a signature on every file except checksums.
          find ai -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' -print0 \
            | xargs -0 -n1 gpg --batch --yes --armor --detach-sign
          zip -qr "$RUNNER_TEMP/bundle.zip" ai

          # The header goes to curl through a file, not an argument, so the token never appears in a
          # process listing. printf is a shell builtin, so it never appears in an argument list.
          auth="$RUNNER_TEMP/central-auth"
          printf 'Authorization: Bearer %s\n' \
            "$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)" > "$auth"

          id=$(curl -sS --fail-with-body -H @"$auth" -F "bundle=@$RUNNER_TEMP/bundle.zip" \
            "$api/upload?publishingType=$PUBLISHING_TYPE&name=taisce-java-${GITHUB_REF_NAME#v}")
          echo "deployment $id, $PUBLISHING_TYPE"

          for _ in $(seq 60); do
            status=$(curl -sS --fail-with-body -X POST -H @"$auth" "$api/status?id=$id")
            state=$(jq -r .deploymentState <<<"$status")
            echo "$state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq .errors <<<"$status"; exit 1 ;;
              VALIDATED)
                if [ "$PUBLISHING_TYPE" = USER_MANAGED ]; then
                  curl -sS --fail-with-body -X DELETE -H @"$auth" "$api/deployment/$id"
                  echo "validated by Central and dropped; nothing was published"
                  exit 0
                fi ;;
            esac
            sleep 30
          done
          echo "::error::deployment $id did not settle within 30 minutes"
          exit 1
