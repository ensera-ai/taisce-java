#
# Build and the deployment-free tests on every push and pull request. The conformance suite needs a
# live deployment and the service's runner; scripts/conformance.sh runs it, and its output is the
# evidence an adapter release carries.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q verify
